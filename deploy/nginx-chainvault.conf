# /etc/nginx/sites-available/chainvault.conf  (hostname is a placeholder; DNS + cert are a separate step)
server {
    listen 80;
    server_name chainvault.ezpdpz.net;
    location / {
        proxy_pass http://127.0.0.1:3860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # required for the rehydration SSE stream
        proxy_read_timeout 1h;
    }
}
